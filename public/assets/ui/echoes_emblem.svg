  <line x1="24" y1="2" x2="24" y2="8" stroke="#dcc39b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="40" x2="24" y2="46" stroke="#dcc39b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="24" x2="8" y2="24" stroke="#dcc39b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="24" x2="46" y2="24" stroke="#dcc39b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Diamond Core -->
  <polygon points="24,19 28,24 24,29 20,24" fill="#f9dfb6"/>
