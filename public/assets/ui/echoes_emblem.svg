  <circle cx="24" cy="24" r="19" fill="none" stroke="#dcc39b" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.5"/>
  <circle cx="24" cy="24" r="14" fill="none" stroke="#dcc39b" stroke-width="1" stroke-opacity="0.8"/>
  <circle cx="24" cy="24" r="8" fill="url(#emblemGlow)"/>
