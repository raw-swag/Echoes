      <stop offset="0%" stop-color="#dcc39b" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#a18b67" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#111322" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="24" cy="24" r="23" fill="#111322" stroke="#dcc39b" stroke-width="1.2" stroke-opacity="0.6"/>
